[package]
name = "vrccreationapp"
version = "0.1.0"
description = "Open-source manager for VRChat projects and VPM packages"
authors = ["zachLabs"]
edition = "2021"
license = "MIT"

[lib]
name = "vrccreationapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
reqwest = { version = "0.13", features = ["gzip", "brotli", "json"] }
tokio = { version = "1", features = ["sync", "fs", "rt", "net", "io-util", "time"] }
url = "2"
include_dir = "0.7"
futures = "0.3"
pin-project-lite = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
indexmap = "2"
tauri-plugin-dialog = "2"
vrc-get-vpm = { git = "https://github.com/vrc-get/vrc-get", rev = "29bb9ea3cb38ece629dbb75999cc591fa5cad755", features = ["experimental-project-management", "experimental-unity-management"] }
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-single-instance = "2.5.2"
fs4 = "1.1.0"
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
rfd = { version = "0.17", default-features = false }

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
