name: Build

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Check the tag is a plain version and matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "The tag $env:TAG is not a plain version like v1.2.3"
            exit 1
          }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = $env:TAG.TrimStart("v")
          if ($version -ne $tag) {
            Write-Error "Tag $tag does not match the app version $version"
            exit 1
          }

      - name: Check the licenses file is up to date
        shell: bash
        run: |
          python scripts/generate-licenses.py
          git diff --exit-code THIRD-PARTY-LICENSES.txt

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        run: npx tauri build --bundles nsis,msi

      - name: Collect release files
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release/
          Copy-Item src-tauri/target/release/vrccreationapp.exe "release/VRCCreationApp-$version-portable.exe"
          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii release/SHA256SUMS-windows.txt
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build AppImage and deb
        run: npx tauri build --bundles appimage,deb

      - name: Collect release files
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/
          cp src-tauri/target/release/bundle/deb/*.deb release/
          cd release
          sha256sum * > SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/*

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the release notes from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag $TAG is not a plain version like v1.2.3"
            exit 1
          fi
          git fetch --tags --force
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > notes.md
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: VRCCreationApp ${{ github.ref_name }}
          files: release/*
          body_path: notes.md
          draft: false
          prerelease: false
          make_latest: true
